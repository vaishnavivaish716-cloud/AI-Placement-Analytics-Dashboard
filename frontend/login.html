<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Placement Analytics Dashboard</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

<div class="login-box">

    <h1>🎓 AI Placement Analytics Dashboard</h1>

    <h2>Admin Login</h2>
    <select id="userType">

    <option value="admin">Admin</option>

    <option value="student">Student</option>

</select>

    <input
        type="text"
        id="username"
        placeholder="Username">

    <input
        type="password"
        id="password"
        placeholder="Password">

    <button onclick="login()">
        
        Login
    </button>

    <p id="error"></p>

</div>

<script src="login.js"></script>

</body>
</html>
